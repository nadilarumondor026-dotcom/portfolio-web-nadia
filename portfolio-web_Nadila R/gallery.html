<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Gallery</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: black;
  color: white;
  text-align: center;
}

nav {
  background: #0d1b2a;
  padding: 15px;
  box-shadow: 0 0 10px cyan;
}

nav ul {
  list-style: none;
  display: flex;
  justify-content: center;
}

nav ul li {
  margin: 0 15px;
}

nav a {
  color: white;
  text-decoration: none;
}

/* JUDUL */
h1 {
  color: cyan;
  margin-top: 30px;
}

/* GALLERY GRID */
.gallery {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
  margin-top: 40px;
}

/* POLAROID STYLE */
.polaroid {
  background: white;
  padding: 10px;
  border-radius: 10px;
  width: 220px;
  box-shadow: 0 0 15px cyan;
  transition: 0.3s;
}

.polaroid:hover {
  transform: scale(1.05);
}

.polaroid img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.caption {
  color: black;
  margin-top: 10px;
}
</style>

</head>
<body>

<nav>
  <h2>MyPortfolio</h2>
  <ul>

    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="blog.html">Blog</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
</nav>

<h1>⚡ Gallery ⚡</h1>

<div class="gallery">

  <div class="polaroid">
    <img src="images/nad1.jpeg">
    <div class="caption">Kegiatan</div>
  </div>

  <div class="polaroid">
    <img src="images/Zahra1.jpeg">
    <div class="caption">Style</div>
  </div>

  <div class="polaroid">
    <img src="images/Zahra3.jpeg">
    <div class="caption">Daily Life</div>
  </div>

</div>

</body>
</html>
